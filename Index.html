<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG</title>
    <link rel="stylesheet" href="style.css">
    <script src="enemies-db.js"></script>
    <script src="gun-db.js"></script>
</head>

<body>
    <div id="game">
        <div id="my-hero-stats">
            <span class="my-hero-name"></span>
            <span class="my-hero-class"></span>
        </div>
        <div id="stats">
            <span class="stat"><span class="exp"></span>0</span>
            <span class="stat"><span class="hp"></span><span class="hp-text"></span></span>
            <span class="stat"><span class="gold"></span>
                <class class="gold-text"></class>
            </span>
        </div>
        <div id="controls">
            <button id="button1"></button>
            <button id="button2"></button>
            <button id="button3"></button>
        </div>
        <!-- <div id="monsterStats">
            <span>Название</span>
            <span>Здоровье</span>
        </div> -->
        <div id="text">
        </div>
    </div>
    <div id="shopgan">
        Shopgun
        <div id="gun-box">
            <div>
                <button id="gun-button1"></button>
                <span id="gun-name1"></span>
            </div>
            <div>
                <button id="gun-button2"></button>
                <span id="gun-name2"></span>
            </div>
            <div>
                <button id="gun-button3"></button>
                <span id="gun-name3"></span>
            </div>
            <div>
                <button id="gun-button4"></button>
                <span id="gun-name4"></span>
            </div>
            <div>
                <button id="gun-button5"></button>
                <span id="gun-name5"></span>
            </div>
            <div>
                <button id="gun-button6"></button>
                <span id="gun-name6"></span>
            </div>
        </div>
    </div>
    <div id="enemies">
        Enemies
        <div id="enemies-box">
        </div>
    </div>
    <div id="start-fight">
        <div id="me-and-enemy">
            <button id="me"></button>
            <p>VS</p>
            <button id="enemy"></button>
        </div>
        <div id="play-and-back">
            <button id="play"></button>
            <button id="back"></button>
        </div>
    </div>
    <div id="start-game">
        <div id="my-name">
            <h2 id="title">Choose your hero</h2>
            <input type="text" id="hero-name-imput">
        </div>
        <div id="my-hero">
            <div id="archer" class="my-hero-card">
                <span>Archer</span>
                <img src="img/img-archer.jpg" alt="" id="img-archer">
            </div>
            <div id="warrior" class="my-hero-card">
                <span>Warrior</span>
                <img src="img/img-warrior.jpg" alt="" id="img-warrior">
            </div>
            <div id="mage" class="my-hero-card">
                <span>Mage</span>
                <img src="img/img-mage.jpg" alt="" id="img-mage">
            </div>
            <div id="engineer" class="my-hero-card">
                <span>Engineer</span>
                <img src="img/img-engineer.jpg" alt="" id="img-engineer">
            </div>
        </div>
        <div id="save-my-stats">
            <button id="save"></button>
        </div>
    </div>
    <div id="enemiesBook">
        <div class="enemies-img-and-text"></div>
        <div id="back-menu">
            <button id="menu"></button>
        </div>
    </div>
    <script src="skript.js"></script>
</body>

</html>
